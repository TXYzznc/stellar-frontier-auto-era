function url(p){return p.split('/').map(encodeURIComponent).join('/')}function familyButtons(){const box=$('#families');box.replaceChildren();['',...FAMILIES].forEach(f=>{const b=document.createElement('button');b.textContent=f||'全部页面族';b.className=f===family?'active':'';b.onclick=()=>{family=f;familyButtons();render()};box.append(b)})}
function render(){const q=$('#search').value.toLowerCase().trim();shown=DATA.filter(r=>r.kind===kind&&(!family||r.family===family)&&(!q||[r.id,r.page,r.family,r.state].join(' ').toLowerCase().includes(q)));$('#count').textContent=(family||'全部页面族')+' / '+types[kind]+' / '+shown.length+' 张';const g=$('#grid');g.replaceChildren();if(!shown.length){const e=document.createElement('div');e.className='empty';e.textContent='没有匹配的图片，请修改搜索条件。';g.append(e);return}shown.forEach((r,i)=>{const e=document.createElement('article');e.className='card';const im=new Image();im.className='preview';im.src=url(r.path);im.alt=r.id;im.loading='lazy';const label=document.createElement('div');label.className='label';const t=document.createElement('strong');t.textContent=r.kind==='main-board'?r.id+' · '+r.family.slice(3):r.kind==='state-board'?r.family+' · 四态对照':r.kind==='state'?r.family+' · '+r.state:r.page;const small=document.createElement('small');small.textContent=r.family+' / '+r.state;const meta=document.createElement('div');meta.className='meta';meta.textContent='1920 × 1080 · PNG / RGBA / sRGB';label.append(t,small,meta);e.append(im,label);e.onclick=()=>open(i);g.append(e)})}
function open(i){current=(i+shown.length)%shown.length;const r=shown[current];$('#full').src=url(r.path);$('#caption').textContent=r.family+' / '+r.page+' / '+r.state;$('#original').href=url(r.path);if(!$('#viewer').open)$('#viewer').showModal()}
$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;$('#tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').oninput=render;$('#prev').onclick=()=>open(current-1);$('#next').onclick=()=>open(current+1);$('#close').onclick=()=>$('#viewer').close();$('#bg').onclick=()=>$('#wrap').classList.toggle('light');$('#zoom').onclick=()=>$('#wrap').classList.toggle('native');document.addEventListener('keydown',e=>{if(!$('#viewer').open)return;if(e.key==='ArrowLeft')open(current-1);if(e.key==='ArrowRight')open(current+1)});familyButtons();render();
